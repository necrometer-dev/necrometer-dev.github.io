name: release-badge

# Watch the necrometer repo for new releases. When one ships, update
# index.html's footer badge with the live tag so visitors see the
# current version on first paint — even if their browser blocks the
# GitHub API or is rate-limited.

on:
  repository_dispatch:
    types: [necrometer-released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to bake in (e.g. v0.4.1)'
        required: true
      url:
        description: 'release html_url'
        required: false
        default: ''
  schedule:
    # hourly safety net: if a release fires outside the dispatch hook
    # (manual gh release create), the badge still catches up.
    - cron: '17 * * * *'

permissions: { contents: write }

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read latest release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.NECRO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # workflow_dispatch wins; otherwise query GH.
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            URL="${{ github.event.inputs.url }}"
          else
            JSON=$(curl --fail --proto '=https' --tlsv1.2 --silent \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              https://api.github.com/repos/necrometer-dev/necrometer/releases/latest)
            TAG=$(printf '%s' "$JSON" | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            URL=$(printf '%s' "$JSON" | sed -n 's/.*"html_url"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          fi
          if [ -z "$TAG" ]; then echo "no release found"; exit 0; fi
          echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "url=$URL"   >> "$GITHUB_OUTPUT"
          echo "latest = $TAG -> $URL"
      - name: update footer badge
        if: steps.rel.outputs.tag != ''
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.tag }}"
          URL="${{ steps.rel.outputs.url }}"
          # Normalise "v0.4.1" -> "0.4.1" for display.
          DISPLAY="engine ${TAG#v}"
          # Escape any / or & in URL for sed.
          ESC_URL=$(printf '%s' "$URL" | sed 's/[&/\]/\\&/g')
          python3 - "$TAG" "$DISPLAY" "$URL" <<'PY'
import re, sys, pathlib
tag, display, url = sys.argv[1:4]
p = pathlib.Path("index.html")
src = p.read_text()
new = re.sub(
    r'<a class="fright" id="rel"[^>]*>[^<]*</a>',
    f'<a class="fright" id="rel" href="{url}">{display}</a>',
    src,
)
if new == src:
    print("badge already up to date — no change")
    p.write_text(new)
    sys.exit(0)
p.write_text(new)
print(f"updated badge: {display} -> {url}")
PY
      - name: commit
        run: |
          set -euo pipefail
          git config user.name "necrometer[bot]"
          git config user.email "bot@necrometer.dev"
          git pull --rebase --autostash || true
          if git diff --quiet -- index.html; then
            echo "no changes — nothing to commit"
            exit 0
          fi
          git add index.html
          git commit -m "site: release badge -> ${{ steps.rel.outputs.tag }}"
          git push
