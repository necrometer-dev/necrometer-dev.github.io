name: hall of corpses

on:
  schedule: [{cron: "23 4 * * 1"}]   # weekly, Mondays
  workflow_dispatch:

permissions: { contents: write }

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.NECRO_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: summon the necrometer
        run: |
          cd /tmp
          REL=https://github.com/necrometer-dev/necrometer/releases/download/v0.2.1
          curl -sSLO $REL/necrometer-x86_64-unknown-linux-musl.tar.gz
          curl -sSLO $REL/SHA256SUMS
          sha256sum -c SHA256SUMS
          tar xzf necrometer-x86_64-unknown-linux-musl.tar.gz
      - run: /tmp/necrometer hall hall.txt hall.json
      - run: |
          git config user.name "necrometer[bot]"
          git config user.email "bot@necrometer.dev"
          git add hall.json
          git diff --cached --quiet || git commit -m "hall of corpses: $(date +%F)"
          git push
