name: hall of corpses

on:
  schedule: [{cron: "23 4 * * 1"}]   # weekly, Mondays
  workflow_dispatch:

permissions: { contents: write }

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.NECRO_TOKEN || secrets.GITHUB_TOKEN }}
      # Single source of truth: bump Cargo.toml in seance and update this.
      NECRO_VERSION: v0.4.5
    steps:
      - uses: actions/checkout@v5
      - name: summon the necrometer
        run: |
          set -euo pipefail
          cd /tmp
          REL="https://github.com/necrometer-dev/necrometer/releases/download/${NECRO_VERSION}"
          curl --fail --proto '=https' --tlsv1.2 --silent --show-error --location \
            --output seance-x86_64-unknown-linux-musl.tar.gz \
            "${REL}/seance-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --proto '=https' --tlsv1.2 --silent --show-error --location \
            --output SHA256SUMS "${REL}/SHA256SUMS"
          sha256sum --strict --check SHA256SUMS
          tar --extract --gzip --file seance-x86_64-unknown-linux-musl.tar.gz
      - run: /tmp/seance hall hall.txt hall.json
      - run: |
          set -euo pipefail
          git config user.name "necrometer[bot]"
          git config user.email "bot@necrometer.dev"
          git pull --rebase --autostash
          git add hall.json
          git diff --cached --quiet || git commit -m "hall of corpses: $(date +%F)"
          git push
